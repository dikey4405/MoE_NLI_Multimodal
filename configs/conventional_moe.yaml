model_name: conventional_moe
input_dim: 4096
num_modes: 4
hidden_dim: 1024
num_routed_experts: 4
num_shared_experts: 0
routed_top_k: 2
expert_ffn_dim: 2048
num_labels: 3
dropout: 0.2

use_relation_contrastive_loss: true
alignment_hidden_dim: 512
relation_contrastive_margin: 0.5
relation_contrastive_loss_coef: 0.1

aux_loss_coef: 0.01

seed: 42
batch_size: 16
num_workers: 0
num_epochs: 15
learning_rate: 0.0001
weight_decay: 0.01
patience: 3

feature_source: sonar
feature_sources:
  sonar:
    train: data_sonar_features/train.pt
    dev: data_sonar_features/dev.pt
    test: data_sonar_features/test.pt
  phobert_xlsr:
    train: outputs/phobert_xlsr_features/train.pt
    dev: outputs/phobert_xlsr_features/dev.pt
    test: outputs/phobert_xlsr_features/test.pt
output_dir: outputs/conventional_moe/{feature_source}
